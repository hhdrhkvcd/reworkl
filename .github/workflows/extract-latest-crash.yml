name: Extract latest HOI4 crash
on:
  push:
    paths:
      - ".github/workflows/extract-latest-crash.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: Extract newest crash archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name 'hoi4_*.rar' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$archive"
          echo "Extracting: $archive"
          rm -rf extracted
          mkdir -p extracted
          7z x "$archive" -oextracted
          cd extracted
          7z a ../latest-crash-extracted.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: latest-crash-extracted
          path: latest-crash-extracted.zip
          retention-days: 2
