l_russian:
 RW26_BOOKMARK_2026:0 "Мир — 2026"
 RW26_BOOKMARK_2026_DESC:0 "1 января 2026 года. Современные государства по всему миру: 198 стран и отдельно обозначенных территорий, новая сетка регионов и независимые балканские страны. Это политическая карта, а не карта текущих линий фронта. Руководители, армии, технологии и общие фокусы пока условные и основаны на базовых механиках HOI4."
 RW26_BOOKMARK_COUNTRY_HISTORY:0 "Выберите страну на мировой карте. Границы приведены к отдельным современным государствам. Для спорных территорий действует явно описанная политика из документа WORLD_2026_RU.txt. Сценарий не воспроизводит действующие правительства, реальное вооружение или численность армий 2026 года."
 RW26_BOOKMARK_OTHER:0 "Можно выбрать любую страну на карте, не только отмеченные державы. Начните новую игру: сохранения версии 1989 несовместимы с новой географией."
 RW26_GENERIC_GOVERNMENT:0 "Государственное руководство"
 RW26_GENERIC_GOVERNMENT_DESC:0 "Условное руководство для игрового прототипа. Имя и портрет действующего главы государства не заявляются. Политический профиль использует четыре базовые идеологии HOI4 и не является справочником современной политики."
 RW26_NATO:0 "НАТО"
 REWORKL_BOOKMARK_SERBIA:0 "Сербия — 1936 (альтернативная)"
 REWORKL_BOOKMARK_SERBIA_DESC:0 "Независимая Сербия и авторское дерево фокусов 1936 года сохранены. Кампания использует общую новую географическую сетку; мировые границы здесь не являются реконструкцией исторического 1936 года."
 REWORKL_BOOKMARK_SERBIA_HISTORY:0 "Альтернативная независимая Сербия: исторические персонажи и исходное дерево фокусов. Ссылки на Белград, Косово, Черногорию и соседние регионы перенесены на новую карту."
 REWORKL_BOOKMARK_SERBIA_OTHER:0 "Общая мировая карта модификации; это альтернативная кампания, не ванильный сценарий Второй мировой войны."
 RW26_administration:0 "Государственное управление"
 RW26_administration_desc:0 "Подготовить общую программу развития."
 RW26_economy:0 "Гражданская экономика"
 RW26_economy_desc:0 "Расширить производственную базу столицы."
 RW26_logistics:0 "Транспорт и снабжение"
 RW26_logistics_desc:0 "Улучшить инфраструктуру столицы. Это базовая механика HOI4, не модель современной экономики."
 RW26_science:0 "Образование и исследования"
 RW26_science_desc:0 "Расширить исследовательские возможности страны."
 RW26_defence:0 "Основы обороны"
 RW26_defence_desc:0 "Подготовить кадры для базовой армии сценария. Современные вооружения пока не моделируются."
 RW26_industry:0 "Оборонная промышленность"
 RW26_industry_desc:0 "Построить одну военную фабрику."
 RW26_cooperation:0 "Международное сотрудничество"
