 yugo_DEF:0 "Югославия"
 conquermont.1.a:0 "Согласиться на объединение"
 conquermont.1.b:0 "Отвергнуть требование"
 conquermont.1.d:0 "Правительство Сербии требует, чтобы Черногория вошла в состав её государства. Принятие предложения приведёт к объединению, а отказ даст Сербии повод для войны."
 conquermont.1.t:0 "Присоединиться к Сербии?"
 old_world_serbia_fixkosovo:0 "Развитие Косово"
 old_world_serbia_fixkosovo_desc:0 "Косово отстаёт от остальных сербских регионов. Вложения в его развитие должны сократить этот разрыв."
 old_world_serbia_killkosovo:0 "Захват Косово"
 old_world_serbia_killkosovo_desc:0 "Сербское руководство намерено установить контроль над Косово и включить его в состав страны."
 old_world_serbia_tree1_focus_10:0 "Демократический путь"
 old_world_serbia_tree1_focus_100:0 "Социальная политика"
 old_world_serbia_tree1_focus_100_desc:0 "Государству необходимы социальные реформы, способные улучшить положение населения."
 old_world_serbia_tree1_focus_101:0 "Свобода для всех людей"
 old_world_serbia_tree1_focus_101_desc:0 "Права и свободы должны распространяться на всех граждан, а не оставаться привилегией отдельных групп."
 old_world_serbia_tree1_focus_102:0 "Свобода для всех стран"
 old_world_serbia_tree1_focus_102_desc:0 "Наш политический курс провозглашает право народов самостоятельно определять своё будущее."
 old_world_serbia_tree1_focus_103:0 "Свобода для всех рабочих"
 old_world_serbia_tree1_focus_103_desc:0 "Трудящиеся должны получить политические права и возможность отстаивать свои интересы."
 old_world_serbia_tree1_focus_104:0 "Переворот Кочи"
 old_world_serbia_tree1_focus_104_desc:0 "Сторонники Кочи Поповича стремятся изменить власть под лозунгами освобождения народа."
 old_world_serbia_tree1_focus_105:0 "Разрешить деятельность коммунистов"
 old_world_serbia_tree1_focus_105_desc:0 "Легализация коммунистического движения станет одним из шагов политической реформы."
 old_world_serbia_tree1_focus_106:0 "Путь Маркса"
 old_world_serbia_tree1_focus_106_desc:0 "Марксистские идеи находят всё больше сторонников среди молодёжи и рабочего движения."
 old_world_serbia_tree1_focus_107:0 "Умеренный социализм"
 old_world_serbia_tree1_focus_107_desc:0 "Социалистические преобразования могут идти путём компромиссов и постепенных реформ."
 old_world_serbia_tree1_focus_108:0 "Коммунистические выборы"
 old_world_serbia_tree1_focus_108_desc:0 "Коммунисты намерены закрепить свой политический курс через участие в выборах."
 old_world_serbia_tree1_focus_109:0 "Празднование революции"
 old_world_serbia_tree1_focus_109_desc:0 "Новая власть отмечает победу революции и стремится сплотить вокруг неё общество."
 old_world_serbia_tree1_focus_10_desc:0 "Будущее страны должно определяться республиканскими институтами и волей избирателей."
 old_world_serbia_tree1_focus_11:0 "Восстановить военную промышленность"
 old_world_serbia_tree1_focus_110:0 "Свобода печати"
 old_world_serbia_tree1_focus_110_desc:0 "Свободное обсуждение общественных вопросов должно стать частью политического освобождения."
 old_world_serbia_tree1_focus_111:0 "Экономические реформы"
 old_world_serbia_tree1_focus_111_desc:0 "Хозяйственная система нуждается в преобразованиях, отвечающих новому политическому курсу."
 old_world_serbia_tree1_focus_112:0 "Вернуть Тито из Хорватии"
 old_world_serbia_tree1_focus_112_desc:0 "Иосип Броз Тито рассматривается как деятель, способный возглавить общую югославскую коммунистическую программу."
 old_world_serbia_tree1_focus_113:0 "Дружба с Советским Союзом"
 old_world_serbia_tree1_focus_113_desc:0 "Советский Союз станет главным внешнеполитическим партнёром нашего социалистического государства."
 old_world_serbia_tree1_focus_114:0 "Снизить призывной возраст"
 old_world_serbia_tree1_focus_114_desc:0 "Руководство расширяет круг граждан, которых можно привлечь к военной службе."
 old_world_serbia_tree1_focus_115:0 "Пригласить советских экономистов"
 old_world_serbia_tree1_focus_115_2:0 "Импорт советских танков"
 old_world_serbia_tree1_focus_115_2_desc:0 "Закупки советской бронетехники помогут оснастить наши танковые части."
 old_world_serbia_tree1_focus_115_desc:0 "Опыт советских специалистов будет использован при подготовке экономических преобразований."
 old_world_serbia_tree1_focus_116:0 "Титоизм"
 old_world_serbia_tree1_focus_116_desc:0 "Государство обратится к особому югославскому варианту социалистического устройства, связанному с Тито."
 old_world_serbia_tree1_focus_117:0 "Военный социализм"
 old_world_serbia_tree1_focus_117_desc:0 "Социалистическая экономика и общество будут мобилизованы ради военных задач государства."
 old_world_serbia_tree1_focus_118:0 "Коммунистический поход"
 old_world_serbia_tree1_focus_118_desc:0 "Сторонники революционного курса требуют распространить социалистические преобразования за пределы страны."
 old_world_serbia_tree1_focus_119:0 "Сокрушить европейские демократии"
 old_world_serbia_tree1_focus_119_desc:0 "Революционное руководство рассматривает европейские капиталистические демократии как противников своего политического проекта."
 old_world_serbia_tree1_focus_11_desc:0 "Оружейные предприятия нуждаются в обновлении. Надёжное производство вооружения станет основой армейской реформы."
 old_world_serbia_tree1_focus_12:0 "Импорт строительных материалов"
 old_world_serbia_tree1_focus_120:0 "Сокрушить европейские монархии"
 old_world_serbia_tree1_focus_120_desc:0 "Монархические режимы Европы становятся следующей целью сторонников революционной экспансии."
 old_world_serbia_tree1_focus_121:0 "Сокрушить европейский фашизм"
 old_world_serbia_tree1_focus_121_desc:0 "Революционное движение намерено выступить против европейских фашистских режимов."
 old_world_serbia_tree1_focus_122:0 "Вечная революция"
 old_world_serbia_tree1_focus_122_desc:0 "Борьба против капиталистического порядка объявляется постоянной задачей государства."
 old_world_serbia_tree1_focus_123:0 "Надежда на будущее"
 old_world_serbia_tree1_focus_123_desc:0 "После длительного противостояния возникает возможность мирного развития и восстановления страны."
 old_world_serbia_tree1_focus_124:0 "Создать БИА"
 old_world_serbia_tree1_focus_124_desc:0 "Государству необходима собственная служба разведки и безопасности."
 old_world_serbia_tree1_focus_125:0 "Объединить Балканы"
 old_world_serbia_tree1_focus_125_desc:0 "Балканские земли должны войти в общую Социалистическую Федеративную Республику."
 old_world_serbia_tree1_focus_126:0 "Собственный путь"
 old_world_serbia_tree1_focus_126_desc:0 "Мы намерены проводить самостоятельную политику, не превращаясь в зависимое государство."
 old_world_serbia_tree1_focus_127:0 "Военное положение"
 old_world_serbia_tree1_focus_127_desc:0 "Руководство вводит особый режим управления, стремясь сплотить страну перед лицом внутренних и внешних угроз."
 old_world_serbia_tree1_focus_128:0 "Выступить против Греции"
 old_world_serbia_tree1_focus_128_desc:0 "Правительство переходит к силовому давлению на Грецию ради расширения своего влияния на Балканах."
 old_world_serbia_tree1_focus_129:0 "Единый подлинный союз"
 old_world_serbia_tree1_focus_129_desc:0 "Наше руководство требует объединения под одним политическим знаменем и готовится навязать этот проект соперникам."
 old_world_serbia_tree1_focus_12_desc:0 "Для новых строек не хватает материалов. Закупки за рубежом помогут обеспечить промышленное развитие."
 old_world_serbia_tree1_focus_13:0 "Потребовать объединения с Черногорией"
 old_world_serbia_tree1_focus_130:0 "Королевская фракция"
 old_world_serbia_tree1_focus_130_desc:0 "Сторонники короны объединяются в собственную фракцию, чтобы укрепить позиции монархии."
 old_world_serbia_tree1_focus_131:0 "Расширить исследовательский институт"
 old_world_serbia_tree1_focus_131_desc:0 "Исследовательскому институту нужны дополнительные возможности для развития отечественной науки."
 old_world_serbia_tree1_focus_13_desc:0 "Белград предложит Черногории войти в общее государство. Решение черногорского правительства определит дальнейшие отношения."
 old_world_serbia_tree1_focus_14:0 "Коммунистический путь"
 old_world_serbia_tree1_focus_14_desc:0 "Коммунистические организации получают возможность расширить своё влияние и предложить стране социалистический курс."
 old_world_serbia_tree1_focus_15:0 "Интернациональный легион"
 old_world_serbia_tree1_focus_15_desc:0 "Наши добровольческие бригады готовы поддерживать дружественные движения за пределами Сербии."
 old_world_serbia_tree1_focus_17:0 "Хаос в стране"
 old_world_serbia_tree1_focus_17_desc:0 "Политический кризис расшатывает государственные институты. Соперничающие силы пытаются воспользоваться нестабильностью."
 old_world_serbia_tree1_focus_18:0 "Игнорировать сопротивление"
 old_world_serbia_tree1_focus_18_desc:0 "Правительство отказывается идти навстречу противникам. Такой выбор грозит дальнейшим обострением внутреннего кризиса."
 old_world_serbia_tree1_focus_19:0 "Новые политические движения"
 old_world_serbia_tree1_focus_19_desc:0 "На политическую сцену выходят «Славянские варвары» и коммунисты Санджака. Прежняя партийная система меняется."
 old_world_serbia_tree1_focus_2:0 "Премии рабочим"
 old_world_serbia_tree1_focus_20:0 "Первобытный путь"
 old_world_serbia_tree1_focus_20_desc:0 "Радикальные сторонники возвращения к истокам отвергают современный уклад и предлагают стране первобытный путь."
 old_world_serbia_tree1_focus_22:0 "Сербская колониальная компания"
 old_world_serbia_tree1_focus_22_desc:0 "Сторонники заморской экспансии предлагают создать компанию, которая станет проводником сербских интересов за пределами Балкан."
 old_world_serbia_tree1_focus_23:0 "Строительная мощь"
 old_world_serbia_tree1_focus_23_desc:0 "Промышленный рост требует новых предприятий и инфраструктуры. Строительство должно стать государственным приоритетом."
 old_world_serbia_tree1_focus_24:0 "Ставка на военную промышленность"
 old_world_serbia_tree1_focus_24_desc:0 "Промышленная политика будет подчинена нуждам вооружённых сил и обеспечению армии."
 old_world_serbia_tree1_focus_25:0 "Инвестиции в «Бету»"
 old_world_serbia_tree1_focus_25_desc:0 "Вложения в компанию «Бета» помогут развивать добывающие предприятия и использование природных ресурсов."
 old_world_serbia_tree1_focus_26:0 "Возвращение к язычеству"
 old_world_serbia_tree1_focus_26_desc:0 "Новый режим обращается к языческим традициям и образу Сварога. Этот выбор изменит политический облик государства."
 old_world_serbia_tree1_focus_27:0 "Жертвоприношения"
 old_world_serbia_tree1_focus_27_desc:0 "Языческий режим придаёт особое значение обрядам и жертвоприношениям, делая их частью государственного культа."
 old_world_serbia_tree1_focus_28:0 "Смерть миру"
 old_world_serbia_tree1_focus_28_desc:0 "Режим окончательно отвергает мирное сосуществование и делает ставку на непрерывную экспансию."
 old_world_serbia_tree1_focus_29:0 "Оружие от сторонников первобытного пути"
 old_world_serbia_tree1_focus_29_desc:0 "Сторонники нашего необычного движения передали стране значительные запасы стрелкового оружия."
 old_world_serbia_tree1_focus_2_desc:0 "Недовольство рабочих нельзя оставлять без внимания. Материальные уступки помогут наладить отношения государства с трудящимися."
 old_world_serbia_tree1_focus_30:0 "Пересмотреть роль монархии"
 old_world_serbia_tree1_focus_30_desc:0 "Монархический порядок не избавил Сербию от политического хаоса. Его место в будущем страны придётся пересмотреть."
 old_world_serbia_tree1_focus_31:0 "Угроза фашизма"
 old_world_serbia_tree1_focus_31_desc:0 "Влияние фашистских организаций растёт. Правительство должно определить своё отношение к этой угрозе."
 old_world_serbia_tree1_focus_32:0 "Марш на Белград"
 old_world_serbia_tree1_focus_32_desc:0 "Фашистское движение пытается взять власть, направив своих сторонников к столице."
 old_world_serbia_tree1_focus_33:0 "Сохранить власть Недича"
 old_world_serbia_tree1_focus_33_desc:0 "Милан Недич останется во главе режима и продолжит определять его политический курс."
 old_world_serbia_tree1_focus_34:0 "Свобода или смерть"
 old_world_serbia_tree1_focus_34_desc:0 "Дража Михаилович и четники берут государственное управление в свои руки."
 old_world_serbia_tree1_focus_35:0 "Да здравствует король!"
 old_world_serbia_tree1_focus_35_desc:0 "Монархисты намерены сохранить королевскую власть как основу государственного порядка."
 old_world_serbia_tree1_focus_36:0 "«Збор»"
 old_world_serbia_tree1_focus_36_desc:0 "Движение «Збор» претендует на ведущую роль в фашистском лагере и требует усилить своё влияние."
 old_world_serbia_tree1_focus_37:0 "Фашистская пропаганда"
 old_world_serbia_tree1_focus_37_desc:0 "Режим разворачивает пропагандистскую кампанию, стремясь привлечь молодёжь и укрепить общественную поддержку."
 old_world_serbia_tree1_focus_38:0 "Подготовка к завоеваниям"
 old_world_serbia_tree1_focus_38_desc:0 "Сторонники экспансии требуют восстановить прежние границы и подготовить государство к новым войнам."
 old_world_serbia_tree1_focus_39:0 "Союз с Карагеоргиевичами"
 old_world_serbia_tree1_focus_39_desc:0 "Династия Карагеоргиевичей может сохранить корону, даже если реальная власть будет ограничена конституцией."
 old_world_serbia_tree1_focus_4:0 "Разжечь боевой дух"
 old_world_serbia_tree1_focus_41:0 "Расширить оружейные заводы Белграда"
 old_world_serbia_tree1_focus_41_desc:0 "Новые мощности в столичном регионе расширят возможности сербской военной промышленности."
 old_world_serbia_tree1_focus_42:0 "Расширить строительные компании в провинции"
 old_world_serbia_tree1_focus_42_desc:0 "Провинциальным предприятиям нужны средства и заказы, чтобы развитие не ограничивалось одной столицей."
 old_world_serbia_tree1_focus_44:0 "Ужесточить регулирование"
 old_world_serbia_tree1_focus_44_desc:0 "Государство усилит надзор за компаниями и установит более строгие правила хозяйственной деятельности."
 old_world_serbia_tree1_focus_45:0 "Наша славная промышленность"
 old_world_serbia_tree1_focus_45_desc:0 "Труд заводских коллективов должен стать предметом национальной гордости и основой экономического роста."
 old_world_serbia_tree1_focus_46:0 "Поддержка крестьян"
 old_world_serbia_tree1_focus_46_desc:0 "Поддержка сельских хозяйств поможет привлечь крестьян на сторону государственных преобразований."
 old_world_serbia_tree1_focus_47:0 "Создать фашистскую национальную гвардию"
 old_world_serbia_tree1_focus_47_desc:0 "Режим формирует национальную гвардию как опору своей власти и инструмент военной мобилизации."
 old_world_serbia_tree1_focus_48:0 "Импорт немецкого оружия"
 old_world_serbia_tree1_focus_48_desc:0 "Закупки немецкого вооружения помогут восполнить потребности сербской армии."
 old_world_serbia_tree1_focus_49:0 "Фашистская военная подготовка"
 old_world_serbia_tree1_focus_49_desc:0 "Подготовка войск потребует времени, но режим намерен создать дисциплинированные и боеспособные части."
 old_world_serbia_tree1_focus_4_desc:0 "Страна готовится к борьбе. Армии и обществу нужна уверенность в собственных силах."
 old_world_serbia_tree1_focus_5:0 "Обеспечить Великую Сербию"
 old_world_serbia_tree1_focus_51:0 "Повысить налоги"
 old_world_serbia_tree1_focus_51_desc:0 "Для финансирования государственных программ потребуется увеличить налоговые поступления."
 old_world_serbia_tree1_focus_52:0 "Христианское образование"
 old_world_serbia_tree1_focus_52_desc:0 "Правительство намерено усилить роль христианской традиции в системе образования."
 old_world_serbia_tree1_focus_53:0 "Сохранить власть князя Павла"
 old_world_serbia_tree1_focus_53_desc:0 "Сторонники князя Павла считают его самостоятельным государственным деятелем, а не только временным регентом."
 old_world_serbia_tree1_focus_55:0 "Королевская гвардия"
 old_world_serbia_tree1_focus_55_desc:0 "Короне необходимы надёжные гвардейские части, способные защищать монарха и государственный порядок."
 old_world_serbia_tree1_focus_58:0 "Набрать верных монархистов"
 old_world_serbia_tree1_focus_58_desc:0 "Убеждённые сторонники короны станут основой сил, на которые сможет опереться монархия."
 old_world_serbia_tree1_focus_59:0 "Сербия прежде всего"
 old_world_serbia_tree1_focus_59_desc:0 "Прежде чем вмешиваться во внешние конфликты, необходимо сосредоточиться на внутренних потребностях страны."
 old_world_serbia_tree1_focus_5_copy:0 "Единство и братство"
 old_world_serbia_tree1_focus_5_copy_desc:0 "Объединение страны должно опираться на общую солидарность и восстановление её прежнего влияния."
 old_world_serbia_tree1_focus_5_desc:0 "Сторонники Великой Сербии призывают восстановить её могущество и добиться национального объединения."
 old_world_serbia_tree1_focus_60:0 "Автономия религиозных меньшинств"
 old_world_serbia_tree1_focus_60_desc:0 "Разнообразие культур и вероисповеданий требует компромисса. Меньшинства получат гарантии самостоятельности."
 old_world_serbia_tree1_focus_61:0 "Ассимиляция религиозных меньшинств"
 old_world_serbia_tree1_focus_61_2:0 "Пригласить немецких специалистов"
 old_world_serbia_tree1_focus_61_2_desc:0 "Опыт немецких инженеров и технических специалистов может помочь развитию отечественной промышленности."
 old_world_serbia_tree1_focus_61_desc:0 "Вместо автономии правительство выбирает курс на единую национальную идентичность и ассимиляцию."
 old_world_serbia_tree1_focus_62:0 "Слава Сербии!"
 old_world_serbia_tree1_focus_62_2:0 "Четники"
 old_world_serbia_tree1_focus_62_2_desc:0 "Четническая гвардия получит официальное признание и место в военной системе государства."
 old_world_serbia_tree1_focus_62_desc:0 "Власть провозглашает национальное возрождение и стремится укрепить чувство общей гордости за страну."
 old_world_serbia_tree1_focus_63:0 "Разгромить усташей"
 old_world_serbia_tree1_focus_63_2:0 "Только христиане в армии"
 old_world_serbia_tree1_focus_63_2_desc:0 "Режим вводит религиозные ограничения на службу в вооружённых силах, отдавая предпочтение христианам."
 old_world_serbia_tree1_focus_63_desc:0 "Правительство намерено покончить с влиянием усташского движения и перейти к решительным действиям."
 old_world_serbia_tree1_focus_64:0 "Покончить с коррупцией"
 old_world_serbia_tree1_focus_64_desc:0 "Злоупотребления чиновников ослабляют государство. Необходимо ограничить коррупцию и восстановить доверие к управлению."
 old_world_serbia_tree1_focus_65:0 "Новая династия"
 old_world_serbia_tree1_focus_65_desc:0 "Сторонники Дражи Михаиловича предлагают короновать его и основать новую правящую династию."
 old_world_serbia_tree1_focus_66:0 "С верой в Бога, за короля и Отечество"
 old_world_serbia_tree1_focus_66_desc:0 "Верность вере, монарху и Отечеству становится главным лозунгом королевского режима."
 old_world_serbia_tree1_focus_67:0 "Сохранить законного короля"
 old_world_serbia_tree1_focus_67_desc:0 "Карагеоргиевичи сохранят престол как династия, на которую опирается традиционная монархическая легитимность."
 old_world_serbia_tree1_focus_68:0 "Белградский исследовательский институт"
 old_world_serbia_tree1_focus_68_desc:0 "Отечественной науке нужны собственные учреждения и подготовленные специалисты. Белград станет центром этих усилий."
 old_world_serbia_tree1_focus_69_2:0 "Верфи Черногории"
 old_world_serbia_tree1_focus_69_2_desc:0 "Развитие черногорских верфей расширит возможности страны в судостроении."
 old_world_serbia_tree1_focus_7:0 "Сербская Спарта"
 old_world_serbia_tree1_focus_70:0 "Конец суверенитету Боснии"
 old_world_serbia_tree1_focus_70_desc:0 "Сторонники объединения требуют вернуть Боснию под власть общего государства."
 old_world_serbia_tree1_focus_71:0 "Взять Боснию"
 old_world_serbia_tree1_focus_71_desc:0 "Белград переходит от заявлений к действиям, намереваясь включить боснийские земли в свой союз."
 old_world_serbia_tree1_focus_72:0 "Завоевать юг"
 old_world_serbia_tree1_focus_72_desc:0 "Южное направление станет следующим этапом территориальной экспансии."
 old_world_serbia_tree1_focus_73:0 "Присоединить Македонию"
 old_world_serbia_tree1_focus_73_desc:0 "Правительство требует включить Македонию в общее государство."
 old_world_serbia_tree1_focus_74:0 "Удар по усташам"
 old_world_serbia_tree1_focus_74_desc:0 "Военное руководство готовит наступление против сил, которые считает препятствием для объединения региона."
 old_world_serbia_tree1_focus_75:0 "Осуществлённая мечта"
 old_world_serbia_tree1_focus_75_desc:0 "Сторонники национального объединения празднуют достижение главной территориальной цели своего движения."
 old_world_serbia_tree1_focus_76:0 "Удар на север"
 old_world_serbia_tree1_focus_76_desc:0 "Северные земли станут следующим направлением расширения государства."
 old_world_serbia_tree1_focus_77:0 "Восстановленная Югославия"
 old_world_serbia_tree1_focus_77_desc:0 "Объединённые земли вновь получают общее югославское государственное устройство."
 old_world_serbia_tree1_focus_78:0 "Королевская Словения"
 old_world_serbia_tree1_focus_78_desc:0 "Монархисты требуют распространить власть короны на Словению."
 old_world_serbia_tree1_focus_79:0 "Дух империи"
 old_world_serbia_tree1_focus_79_desc:0 "Имперское движение обращается к образам былого величия и призывает продолжить восстановление державы."
 old_world_serbia_tree1_focus_7_desc:0 "Сторонники военного пути требуют вернуть утраченные позиции и сделать Сербию оплотом воинской доблести."
 old_world_serbia_tree1_focus_8:0 "Определить политический курс"
 old_world_serbia_tree1_focus_80:0 "Болгария для нас"
 old_world_serbia_tree1_focus_80_desc:0 "Руководство намерено присоединить Болгарию к своему государству."
 old_world_serbia_tree1_focus_81:0 "Объединить всех"
 old_world_serbia_tree1_focus_81_desc:0 "Продолжение объединительной кампании должно распространить власть государства на Албанию."
 old_world_serbia_tree1_focus_82:0 "Территория империи"
 old_world_serbia_tree1_focus_82_desc:0 "Достижение заявленных границ позволяет перейти к укреплению имперского государственного устройства."
 old_world_serbia_tree1_focus_83:0 "Албанский народ"
 old_world_serbia_tree1_focus_83_desc:0 "Албанцы не относятся к южным славянам, однако сторонники интеграции считают возможным их включение в общий политический проект."
 old_world_serbia_tree1_focus_84:0 "Республика всех вероисповеданий"
 old_world_serbia_tree1_focus_84_desc:0 "Государство должно объединять граждан независимо от веры, не допуская господства национальной исключительности."
 old_world_serbia_tree1_focus_85:0 "Союз всех южных славян"
 old_world_serbia_tree1_focus_85_desc:0 "Южнославянские народы должны получить общее государство и единое политическое представительство."
 old_world_serbia_tree1_focus_86:0 "Великая Югославия"
 old_world_serbia_tree1_focus_86_2:0 "Сербский Тунис"
 old_world_serbia_tree1_focus_86_2_desc:0 "Колониальный проект вновь обращает внимание Сербии на Тунис."
 old_world_serbia_tree1_focus_86_3:0 "Сербская армия"
 old_world_serbia_tree1_focus_86_3_desc:0 "Вооружённые силы нуждаются в последовательной реформе и ясном представлении о будущей войне."
 old_world_serbia_tree1_focus_86_desc:0 "Объединение южнославянских земель становится основой проекта Великой Югославии."
 old_world_serbia_tree1_focus_87:0 "Ставка на бронетехнику"
 old_world_serbia_tree1_focus_87_desc:0 "Развитие танковых сил станет приоритетным направлением армейской модернизации."
 old_world_serbia_tree1_focus_88:0 "Ставка на пехоту"
 old_world_serbia_tree1_focus_88_desc:0 "Армейская реформа сосредоточится на вооружении, подготовке и организации пехотных подразделений."
 old_world_serbia_tree1_focus_89:0 "Наша артиллерия"
 old_world_serbia_tree1_focus_89_desc:0 "Огневая поддержка необходима войскам на поле боя. Артиллерия должна занять достойное место в военных планах."
 old_world_serbia_tree1_focus_8_desc:0 "В Сербии соперничают разные политические движения. Пора решить, какой путь выберет государство."
 old_world_serbia_tree1_focus_9:0 "Патриотический путь"
 old_world_serbia_tree1_focus_90:0 "Танки для наших войск"
 old_world_serbia_tree1_focus_90_desc:0 "Развитие танковой техники позволит оснастить армию современными боевыми машинами."
 old_world_serbia_tree1_focus_94:0 "Расширить производственные мощности"
 old_world_serbia_tree1_focus_94_desc:0 "Увеличение промышленного выпуска необходимо для дальнейшего развития вооружённых сил."
 old_world_serbia_tree1_focus_95:0 "Солдаты на земле"
 old_world_serbia_tree1_focus_95_2:0 "Мобилизовать больше людей"
 old_world_serbia_tree1_focus_95_2_desc:0 "Для поддержки войск и расширения армии потребуется привлечь дополнительные людские ресурсы."
 old_world_serbia_tree1_focus_95_desc:0 "Основой армии станут многочисленные пехотные подразделения с надёжным стрелковым вооружением."
 old_world_serbia_tree1_focus_96:0 "Смешанная армия"
 old_world_serbia_tree1_focus_96_2:0 "Солдат с гражданской профессией"
 old_world_serbia_tree1_focus_96_2_desc:0 "Вне фронтовой службы военнослужащие смогут участвовать в хозяйственной жизни страны."
 old_world_serbia_tree1_focus_96_desc:0 "Армия будет сочетать разные рода войск и способы ведения боевых действий."
 old_world_serbia_tree1_focus_97:0 "Танковый натиск"
 old_world_serbia_tree1_focus_97_2:0 "Ударить по медведю"
 old_world_serbia_tree1_focus_97_2_desc:0 "Руководство намерено противостоять распространению советского влияния."
 old_world_serbia_tree1_focus_97_3:0 "Протесты против правительства"
 old_world_serbia_tree1_focus_97_3_desc:0 "Граждане требуют демократических преобразований и участия в определении будущего страны."
 old_world_serbia_tree1_focus_97_desc:0 "Бронетанковые соединения должны стать ударной силой будущих наступлений."
 old_world_serbia_tree1_focus_98:0 "Конституционная монархия"
 old_world_serbia_tree1_focus_98_desc:0 "Король сохранит символическую роль, а управление государством будет ограничено конституционными институтами."
 old_world_serbia_tree1_focus_99:0 "Полноценная республика"
 old_world_serbia_tree1_focus_99_2:0 "Сближение с Союзниками"
 old_world_serbia_tree1_focus_99_2_desc:0 "Для защиты республиканского курса необходимо искать поддержку у Союзников."
 old_world_serbia_tree1_focus_99_desc:0 "Страна окончательно откажется от монархического устройства в пользу республики."
 old_world_serbia_tree1_focus_9_desc:0 "Националисты предлагают поставить во главу угла сербские интересы и национальное единство."
 ASSIMILATEDMINORITIES:0 "Ассимилированные меньшинства"
 ASSIMILATEDMINORITIES_desc:0 "Государственная политика делает ставку на единую сербскую национальную идентичность."
 AllywiththeKaradjordjevices:0 "Союз с Карагеоргиевичами"
 AllywiththeKaradjordjevices_desc:0 "Монарх сохраняет символическую роль и поддерживает преемственность государственного устройства."
 Beta:0 "«Бета»"
 Beta_desc:0 "Компания участвует в разработке месторождений и снабжении страны природными ресурсами."
 Cetniks:0 "Четники"
 Cetniks_desc:0 "Четнические формирования стали одной из опор действующей власти."
 Col_comp:0 "Сербская колониальная компания"
 Col_comp_desc:0 "Заморская компания расширяет хозяйственные и политические интересы Сербии за пределами Балкан."
 Colture:0 "Республика культур"
 Colture_desc:0 "Общее государство стремится учитывать интересы разных культур и народов."
 Imperialdream:0 "Имперские мечты"
 Imperialdream_desc:0 "Сторонники имперского проекта связывают будущее страны с восстановлением её былого величия."
 Infarmy:0 "Пехотная армия"
 Infarmy_desc:0 "В военном строительстве приоритет отдан пехоте и её подготовке."
 Internacionalna_Legija:0 "Интернациональный легион"
 Internacionalna_Legija_desc:0 "Добровольцы готовы поддерживать дружественные движения за рубежом."
 Meritocracy:0 "Меритократия"
 Meritocracy_desc:0 "Продвижение по службе должно определяться способностями и заслугами, а не происхождением и связями."
 Primal_Nation:0 "Первобытная нация"
 Primal_Nation_desc:0 "Режим отверг прежнюю модель развития и сделал набеги частью нового государственного уклада."
 Religiousminorities:0 "Автономия религиозных меньшинств"
 Religiousminorities_desc:0 "Представители разных вероисповеданий получили гарантии самостоятельности в общем государстве."
 Sacrifice:0 "Жертвоприношения"
 Sacrifice_desc:0 "Обряды жертвоприношения стали частью официального языческого культа."
 Serbia_First:0 "Сербия прежде всего"
 Serbia_First_desc:0 "Власть сосредоточена на укреплении самой Сербии и защите её внутренних интересов."
 Serbian_Economy:0 "Слабая промышленная база"
 Serbian_Economy_copy:0 "Слаборазвитая промышленность"
 Serbian_Economy_copy_copy:0 "Развитая промышленная база"
 Serbian_Economy_copy_copy_copy:0 "Промышленность с упором на строительство"
 Serbian_Economy_copy_copy_copy_2:0 "Военно-промышленный приоритет"
 Serbian_Economy_copy_copy_copy_2_desc:0 "Промышленная политика ориентирована прежде всего на обеспечение вооружённых сил."
 Serbian_Economy_copy_copy_copy_desc:0 "Промышленная политика отдаёт предпочтение строительству и расширению хозяйственной базы."
 Serbian_Economy_copy_copy_desc:0 "Промышленность преодолела первоначальный кризис и стала более устойчивой."
 Serbian_Economy_copy_desc:0 "Первые шаги восстановления сделаны, но промышленная база всё ещё нуждается в развитии."
 Serbian_Economy_desc:0 "Промышленность находится в тяжёлом положении. Восстановление производства остаётся одной из главных задач страны."
 Serbian_arms:0 "Неоснащённые оружейные предприятия"
 Serbian_arms_desc:0 "Оружейное производство нуждается в оборудовании и восстановлении, чтобы надёжно снабжать армию."
 Serbian_army:0 "Поднятый боевой дух"
 Serbian_army_desc:0 "Военнослужащие вновь уверены в своих силах и готовы выполнять поставленные задачи."
 TAXSWEL:0 "Налоги с пользой для страны"
 TAXSWEL_desc:0 "Государство стремится направлять собранные средства на реальные общественные нужды."
 Tank_Focused_Army:0 "Танковая армия"
 Tank_Focused_Army_desc:0 "Бронетанковые силы занимают центральное место в планах военного руководства."
 Worker_bonuses:0 "Уступки рабочим"
 Worker_bonuses_desc:0 "В стране с многочисленным крестьянским населением нужны стимулы, чтобы привлечь людей на фабрики."
 christianarmy:0 "Христианская армия"
 christianarmy_desc:0 "Военное руководство отдаёт предпочтение христианам и связывает службу с религиозной верностью."
 fascisttraining:0 "Фашистская военная подготовка"
 fascisttraining_desc:0 "Молодёжь проходит подготовку, которую режим считает необходимой для будущей службы."
 germantech:0 "Немецкие специалисты"
 germantech_desc:0 "Приглашённые немецкие специалисты участвуют в техническом развитии страны."
 gloryindustry:0 "Наша славная промышленность"
 gloryindustry_desc:0 "Промышленный труд стал одним из центральных образов государственной пропаганды."
 happyfarms:0 "Довольные крестьяне"
 happyfarms_desc:0 "Поддержка сельского хозяйства улучшила отношение крестьян к государственной политике."
 hightax:0 "Высокие налоги"
 hightax_desc:0 "Повышенная налоговая нагрузка обеспечивает средства для государственных программ."
 intag:0 "Развитая разведслужба"
 intag_desc:0 "Государство располагает собственной системой разведки и обеспечения безопасности."
 jobsoild:0 "Корпоративизм"
 jobsoild_desc:0 "Отрасли хозяйства объединяются в согласованную систему взаимодействия государства и производителей."
 liberty:0 "Свобода для всех"
 liberty_desc:0 "Государственный курс провозглашает общие гражданские права и свободы."
 libworkers:0 "Социалистическая промышленность"
 libworkers_desc:0 "Промышленное развитие подчинено социалистическим принципам организации хозяйства."
 marxpop:0 "Популярность марксизма"
 marxpop_desc:0 "Марксистские идеи получили широкую поддержку среди молодёжи и трудящихся."
 mixedarmy:0 "Смешанная армия"
 mixedarmy_desc:0 "Вооружённые силы сочетают разные рода войск и технические подходы."
