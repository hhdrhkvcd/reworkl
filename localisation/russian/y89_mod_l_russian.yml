 Y89_startup.1.t:0 "Югославия на перепутье"
 Y89_startup.1.d:0 "Начинается кампания 1989 года. Федерация сталкивается с экономическим кризисом, спором о будущем республики и растущим напряжением между её институтами. Ваши решения определят, сможет ли страна договориться о новом устройстве или распадётся."
 Y89_startup.1.a:0 "Начать кампанию 1989 года"
 Y89_startup.2.t:0 "Балканы в 2026 году"
 Y89_startup.2.d:0 "Начинается современная кампания. Государства бывшей Югославии сталкиваются с вопросами европейской интеграции, безопасности, экономики и регионального сотрудничества."
 Y89_startup.2.a:0 "Начать кампанию 2026 года"
 y89_yugoslavia_focus:0 "Национальные интересы Югославии"
 y89_yugoslavia_focus_desc:0 "Курс Социалистической Федеративной Республики Югославия в условиях кризиса 1989 года."
 Y89_BOOKMARK_1989_OTHER_NAME:0 "1989 — другие страны"
 Y89_GER_TEST_economic_recovery:0 "Экономическое восстановление"
 Y89_GER_TEST_economic_recovery_desc:0 "В тестовом сценарии Германия сосредоточивается на внутренних экономических задачах."
 Y89_GER_TEST_infrastructure:0 "Обновление инфраструктуры"
 Y89_GER_TEST_infrastructure_desc:0 "Инвестиции в дороги, железные дороги и коммунальную инфраструктуру."
 Y89_GER_TEST_science:0 "Научные исследования"
 Y89_GER_TEST_science_desc:0 "Поддержка прикладных и промышленных исследований."
 Y89_ITA_TEST_economic_recovery:0 "Экономическое восстановление"
 Y89_ITA_TEST_economic_recovery_desc:0 "В тестовом сценарии Италия сосредоточивается на внутренних экономических задачах."
 Y89_ITA_TEST_infrastructure:0 "Обновление инфраструктуры"
 Y89_ITA_TEST_infrastructure_desc:0 "Инвестиции в транспорт и инфраструктуру страны."
 Y89_ITA_TEST_science:0 "Научные исследования"
 Y89_ITA_TEST_science_desc:0 "Поддержка научных и промышленных исследований."
 Y89_TEST_NON_INTERVENTION:0 "Политика невмешательства (тест)"
 Y89_TEST_NON_INTERVENTION_desc:0 "В тестовом сценарии 1989 года Германия и Италия не генерируют новые военные цели. Их мирные деревья фокусов принудительно назначены сценарием; претензии на югославские территории удалены."
 Y89_GER_TEST_PEACEFUL_TREE:0 "Внутренняя политика Германии"
 Y89_GER_TEST_PEACEFUL_TREE_desc:0 "Тестовое дерево: восстановление экономики, инфраструктуры и науки без территориальной экспансии."
 Y89_ITA_TEST_PEACEFUL_TREE:0 "Внутренняя политика Италии"
 Y89_ITA_TEST_PEACEFUL_TREE_desc:0 "Тестовое дерево: восстановление экономики, инфраструктуры и науки без территориальной экспансии."

 Y89_breakup.1.t:0 "Распад федерации: Словения и Хорватия"
 Y89_breakup.1.d:0 "25 июня 1991 года Словения и Хорватия провозглашают независимость. Федеративные институты теряют контроль над двумя республиками."
 Y89_breakup.1.a:0 "Федерация вступает в полосу распада"
 Y89_breakup.2.t:0 "Независимость Македонии"
 Y89_breakup.2.d:0 "В сентябре 1991 года Македония проводит референдум и выходит из состава федерации."
 Y89_breakup.2.a:0 "Ещё одна республика уходит"
 Y89_breakup.3.t:0 "Независимость Боснии и Герцеговины"
 Y89_breakup.3.d:0 "Весной 1992 года Босния и Герцеговина провозглашает независимость после референдума. Федерация фактически прекращает существование."
 Y89_breakup.3.a:0 "Федеральный центр распался"
 Y89_breakup.4.t:0 "Независимость Черногории"
 Y89_breakup.4.d:0 "В июне 2006 года Черногория провозглашает независимость после референдума. Союз Сербии и Черногории прекращает существование."
 Y89_breakup.4.a:0 "Союз завершён"
 Y89_breakup.5.t:0 "Декларация независимости Косово"
 Y89_breakup.5.d:0 "17 февраля 2008 года Ассамблея Косово провозглашает независимость. Сербия не признаёт декларацию."
 Y89_breakup.5.a:0 "Новый этап истории Балкан"

 Y89_sanctions.1.t:0 "Эмбарго на поставки вооружений: резолюция 713"
 Y89_sanctions.1.d:0 "25 сентября 1991 года Совет Безопасности ООН принимает резолюцию 713. На всю территорию бывшей Югославии распространяется международное эмбарго на поставки вооружений. В стандартной Hearts of Iron IV нет отдельной страны ООН, поэтому это решение отражается национальным духом и историческим событием."
 Y89_sanctions.1.a:0 "Международные поставки вооружений прекращены"
 Y89_sanctions.2.t:0 "Экономические санкции ООН: резолюция 757"
 Y89_sanctions.2.d:0 "30 мая 1992 года Совет Безопасности ООН принимает резолюцию 757 и вводит широкие санкции против Союзной Республики Югославии. В игре торговое эмбарго вводят США, Великобритания, Франция, Германия, Италия, Канада, Япония, Нидерланды, Бельгия, Дания, Норвегия, Швеция, Австралия, Испания и Новая Зеландия. Это игровое представление решения ООН; отдельного тега ООН или НАТО не требуется."
 Y89_sanctions.2.a:0 "Югославия оказывается под международными санкциями"
