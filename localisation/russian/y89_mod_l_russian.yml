l_russian:
 Y89_JNA_commander_name:0 "Командир Югославской народной армии"
 Y89_crisis:0 "Кризис федерации"
 Y89_crisis_desc:0 "1989 год. Внешний долг, инфляция, падение доходов и спор о распределении федеральных средств совпали с конституционным тупиком и напряжением вокруг Косово. После смерти Тито в 1980 году механизм арбитража между республиками ослаб."
 Y89_debt_talks:0 "Переговоры с кредиторами"
 Y89_debt_talks_desc:0 "Международные кредиторы требуют стабилизационных мер. Население ощущает рост цен и ухудшение перспектив, но без реструктуризации долга страна не выйдет из кризиса."
 Y89_stabilization:0 "Стабилизационная программа"
 Y89_stabilization_desc:0 "Борьба с гиперинфляцией требует жёстких мер. В республиках с развитой промышленностью и в менее развитых регионах реформы воспринимаются по-разному."
 Y89_federal_funds:0 "Спор о федеральных средствах"
 Y89_federal_funds_desc:0 "Словения и Хорватия недовольны тем, что ресурсы уходят на поддержку других областей. Менее развитые регионы зависят от федеральной помощи. Неравенство не означает неизбежной вражды, но даёт политикам материал для обвинений."
 Y89_north_industry:0 "Промышленность северо-запада"
 Y89_north_industry_desc:0 "Развитые северо-западные республики требуют вложений в собственную промышленность и экспорт."
 Y89_south_aid:0 "Помощь югу"
 Y89_south_aid_desc:0 "Менее развитые регионы, включая Косово, Македонию и часть Боснии, получают федеральные инвестиции в дороги и предприятия."
 Y89_gastarbeiter:0 "Денежные переводы"
 Y89_gastarbeiter_desc:0 "Трудовая миграция в Западную Европу приносит денежные переводы. Это поддерживает семьи, но не решает проблем долга и производительности."
 Y89_corridors:0 "Транспортные коридоры"
 Y89_corridors_desc:0 "Железные дороги, мосты, электросети и автотрассы связывают республики. Они обслуживают экономику, а в кризис становятся стратегическими объектами."
 Y89_jna:0 "Югославская народная армия"
 Y89_jna_desc:0 "ЮНА располагает тяжёлым вооружением, складами, казармами и командными структурами. Она представляет себя общесоюзным институтом, но по мере распада политического руководства её нейтральность ставится под сомнение."
 Y89_jna_bonus:0 "Югославская народная армия"
 Y89_territorial_defense:0 "Территориальная оборона"
 Y89_territorial_defense_desc:0 "Республиканские силы территориальной обороны и полиция подчинены разным центрам власти."
 Y89_arsenals:0 "Контроль над арсеналами"
 Y89_arsenals_desc:0 "Спор идёт не только о конституционном праве: кто контролирует арсеналы, границы, таможню, аэропорты, телевидение и связь?"
 Y89_officers:0 "Офицерский корпус"
 Y89_officers_desc:0 "Профессиональное командование и запасы вооружения определяют ранний баланс сил. Часть офицеров ЮНА позднее перейдёт в армии новых государств или покинет службу."
 Y89_kosovo_question:0 "Косовский вопрос"
 Y89_kosovo_question_desc:0 "В крае албанское большинство, а Косово занимает особое место в сербской национальной памяти. После протестов 1981 года и меморандума САНУ 1986 года противоположные рассказы о дискриминации и угрозах углубили раскол."
 Y89_revoke_autonomy:0 "Отмена автономии края"
 Y89_revoke_autonomy_desc:0 "28 марта 1989 года сербские конституционные изменения резко сократили автономию Косово и Воеводины. Словенские и хорватские лидеры опасаются, что сильная Сербия будет влиять на федерацию через дополнительные голоса в президентстве."
 Y89_commission:0 "Комиссия по гарантиям"
 Y89_commission_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Сербское руководство отказывается использовать Косово для мобилизации. Автономия сохраняется, а комиссия из сербов, албанцев и других общин готовит гарантии языка, образования, местной полиции и судебного контроля."
 Y89_kosovo_strikes:0 "Забастовки в Косово"
 Y89_kosovo_strikes_desc:0 "Потеря автономии усилила протесты и забастовки в Косово и тревогу других республик."
 Y89_14th_congress:0 "XIV съезд СКЮ"
 Y89_14th_congress_desc:0 "Январь 1990 года. Съезд Союза коммунистов Югославии распался после конфликта делегаций; словенская делегация ушла. Партийный механизм, долго удерживавший республиканские элиты вместе, перестал работать."
 Y89_multiparty_elections:0 "Многопартийные выборы"
 Y89_multiparty_elections_desc:0 "В 1990 году в Словении и Хорватии побеждают сторонники самостоятельности, в Сербии власть сохраняет Милошевич, в Боснии побеждают национальные партии бошняков, сербов и хорватов."
 Y89_army_dispute:0 "Спор о контроле над армией"
 Y89_army_dispute_desc:0 "Когда республика объявляет независимость, вопрос о казармах и складах становится непосредственно военным."
 Y89_slovenia_independence:0 "Независимость Словении"
 Y89_slovenia_independence_desc:0 "25 июня 1991 года Словения провозгласила независимость. Силы территориальной обороны блокировали дороги и изолировали гарнизоны ЮНА."
 Y89_brioni:0 "Брионское соглашение"
 Y89_brioni_desc:0 "7 июля 1991 года Брионское соглашение при посредничестве Европейского сообщества завершило Десятидневную войну. ЮНА вывела большую часть сил из Словении."
 Y89_croatia_independence:0 "Независимость Хорватии"
 Y89_croatia_independence_desc:0 "Вооружённое сопротивление сербских местных руководителей в Краине, Лике, Кордуне, Бании и Восточной Славонии переросло в войну. Осада Вуковара и обстрел Дубровника вызвали международный резонанс."
 Y89_embargo:0 "Эмбарго ООН"
 Y89_embargo_desc:0 "25 сентября 1991 года Совет Безопасности ООН принял резолюцию 713 с общим оружейным эмбарго на территорию Югославии."
 Y89_macedonia_independence:0 "Референдум в Македонии"
 Y89_macedonia_independence_desc:0 "В сентябре 1991 года Македония провела референдум и объявила независимость, избежав масштабной войны распада 1991–1995 годов."
 Y89_bosnia_independence:0 "Референдум в Боснии"
 Y89_bosnia_independence_desc:0 "29 февраля – 1 марта 1992 года большинство проголосовавших поддержало независимость, но многие боснийские сербы бойкотировали голосование. В апреле началась война, осада Сараева продлилась почти четыре года."
 Y89_fry:0 "Союзная Республика Югославия"
 Y89_fry_desc:0 "Сербия и Черногория образуют Союзную Республику Югославия. 30 мая 1992 года резолюция ООН 757 ужесточила санкции."
 Y89_dayton:0 "Дейтонское соглашение"
 Y89_dayton_desc:0 "После Сребреницы, операции «Буря» и кампании НАТО «Обдуманная сила» стороны парафировали соглашение в Дейтоне 21 ноября 1995 года. 14 декабря его подписали в Париже."
 Y89_milosevic_president:0 "Президент СРЮ"
 Y89_milosevic_president_desc:0 "Слободан Милошевич становится президентом Союзной Республики Югославия (1997–2000)."
 Y89_kosovo_war:0 "Война в Косово"
 Y89_kosovo_war_desc:0 "Эскалация 1998 года, провал переговоров в Рамбуйе, операция НАТО «Союзная сила» 24 марта – 10 июня 1999 года. Резолюция ООН 1244 передала край под международную администрацию."
 Y89_october_2000:0 "Октябрь 2000 года"
 Y89_october_2000_desc:0 "После массовых протестов Милошевич потерял президентскую власть. В 2001 году его передали трибуналу МТБЮ."
 Y89_state_union:0 "Государственный союз"
 Y89_state_union_desc:0 "В 2003 году название Югославия уступило место Государственному союзу Сербии и Черногории."
 Y89_montenegro_independence:0 "Независимость Черногории"
 Y89_montenegro_independence_desc:0 "3 июня 2006 года Черногория объявила независимость; Государственный союз распался."
 Y89_kosovo_declaration:0 "Декларация Косово"
 Y89_kosovo_declaration_desc:0 "17 февраля 2008 года Ассамблея Косово провозгласила независимость. Сербия объявила декларацию незаконной; международное признание раскололось."
 Y89_federal_conference:0 "Конституционная конференция"
 Y89_federal_conference_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Федерация созывает конференцию под наблюдением СБСЕ и Европейского сообщества. Закрепляются три уровня власти: республики, конфедеральные институты и местное самоуправление."
 Y89_free_elections:0 "Свободные выборы"
 Y89_free_elections_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. В республиках проходят многопартийные выборы. Национальные партии получают поддержку, но не право менять границы силой."
 Y89_exit_procedure:0 "Процедура выхода"
 Y89_exit_procedure_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Обсуждается пятилетняя процедура выхода: референдум, переговоры, защита гражданства и собственности, международное наблюдение и запрет одностороннего применения силы."
 Y89_ljubljana_treaty:0 "Люблянский договор"
 Y89_ljubljana_treaty_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 25 июня 1991 года подписан Люблянский договор о конфедерации. Республики получают широкую самостоятельность; общими остаются единый рынок, свободное передвижение, инфраструктура, валютная координация и оборона."
 Y89_confederal_army:0 "Конфедеральные силы"
 Y89_confederal_army_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. ЮНА преобразуется в конфедеральные силы с республиканскими гвардиями. Назначения проходят через парламентский комитет, а тяжёлое вооружение ставится под совместный надзор."
 Y89_serb_municipalities:0 "Гарантии сербским общинам"
 Y89_serb_municipalities_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. В Хорватии вместо вооружённой автономии вводятся местное самоуправление, двуязычные службы, пропорциональное представительство в полиции и право обращаться в конституционный суд."
 Y89_bosnia_treaty:0 "Договор для Боснии"
 Y89_bosnia_treaty_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Босния становится суверенной республикой, ассоциированной с конфедерацией, с гарантиями для бошняков, сербов, хорватов и остальных граждан. Склады ЮНА переходят под смешанную комиссию."
 Y89_reconstruction_fund:0 "Фонд восстановления"
 Y89_reconstruction_fund_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 1993 год. Ремонтируются мосты через Саву и Неретву, железнодорожные узлы, линии электропередачи и больницы. Центральный банк становится независимым."
 Y89_single_market:0 "Единый рынок"
 Y89_single_market_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 1994 год. Отменены внутренние торговые барьеры, признаются дипломы и квалификации, создан общий реестр собственности."
 Y89_security_pact:0 "Пакт о безопасности и равноправии"
 Y89_security_pact_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 1995 год. Дейтон не нужен: конфедерация закрепляет недопустимость изменения границ силой, возврат собственности, защиту меньшинств и совместное расследование преступлений."
 Y89_kosovo_autonomy:0 "Автономия Косово"
 Y89_kosovo_autonomy_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 1996–1997 годы. Косово получает расширенную автономию внутри Сербии. Албанский язык равноправен, полиция и суды формируются пропорционально, лидеры края входят в конфедеральный сенат."
 Y89_geneva_conference:0 "Женевская конференция"
 Y89_geneva_conference_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. В 1999 году вместо операции НАТО проходит конференция о статусе края: ещё более широкая автономия и международное наблюдение на пять лет."
 Y89_power_transfer:0 "Сменяемость власти"
 Y89_power_transfer_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 2000 год. Руководство, связанное с авторитарными практиками, теряет власть через выборы, а не через войну и изоляцию. Принят закон о прозрачности госконтрактов."
 Y89_union_republics:0 "Союз югославских республик"
 Y89_union_republics_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 2001–2003 годы. Конфедерация переименована в Союз югославских республик: Совет республик, палата граждан, суд конфедерации и независимый центральный банк."
 Y89_eu_application:0 "Заявка в ЕС"
 Y89_eu_application_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 2004–2008 годы. Союз подаёт заявку как конфедеральный субъект. Еврокомиссия требует единого таможенного режима, независимого суда, прозрачного бюджета и защиты меньшинств."
 Y89_eu_bonus:0 "Заявка в ЕС"
 Y89_stabilization_fund:0 "Стабилизационный фонд"
 Y89_stabilization_fund_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Кризис 2009–2010 годов. Средства распределяются по численности населения, безработице и потребностям инфраструктуры. Центральный банк не допускает гиперинфляции."
 Y89_eu_negotiations:0 "Переговоры с ЕС"
 Y89_eu_negotiations_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 2011–2013 годы. ЕС требует реформы полиции, судов и госзакупок, независимого вещания и прозрачного финансирования партий."
 Y89_civil_protection:0 "Гражданская защита"
 Y89_civil_protection_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Наводнения 2014 года проверяют общую систему гражданской защиты. В 2015 году через Союз проходит миграционный маршрут."
 Y89_greece_agreement:0 "Соглашение с Грецией"
 Y89_greece_agreement_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 2018–2019 годы. Союз выступает единым партнёром в споре о названии Македонии, получая гарантии названия и языка."
 Y89_union_2026:0 "Союз в новой Европе"
 Y89_union_2026_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. 2026 год. Конфедерация шести республик и автономного Косово. Парламент в Белграде, экономический суд в Загребе, транспортный центр в Сараеве, языковой институт в Скопье, совет самоуправления в Подгорице."
 Y89_BOOKMARK_1989:0 "Распад, 1989"
 Y89_BOOKMARK_1989_DESC:0 "Социалистическая Федеративная Республика Югославия входит в глубокий кризис: внешний долг, инфляция, спор о Косово и ослабевший после смерти Тито арбитраж между республиками. История может пойти путём распада и войн или путём договорной конфедерации."
 Y89_BOOKMARK_1989_YUG:0 "Шесть республик и два автономных края. Коллективное президентство, гиперинфляция и спор о будущем федерации."
 Y89_BOOKMARK_1989_OTHER:0 "Остальной мир в этом моде не переработан."
 YUG_SFRY:0 "Социалистическая Федеративная Республика Югославия"
 YUG_SFRY_DEF:0 "Социалистическая Федеративная Республика Югославия"
 YUG_SFRY_ADJ:0 "югославский"
 YUG_FRY:0 "Союзная Республика Югославия"
 YUG_FRY_DEF:0 "Союзная Республика Югославия"
 YUG_FRY_ADJ:0 "югославский"
 YUG_SCG:0 "Сербия и Черногория"
 YUG_SCG_DEF:0 "Государственный союз Сербии и Черногории"
 YUG_SCG_ADJ:0 "сербско-черногорский"
 YUG_SRB:0 "Сербия"
 YUG_SRB_DEF:0 "Республика Сербия"
 YUG_SRB_ADJ:0 "сербский"
 YUG_CONF:0 "Югославская конфедерация"
 YUG_CONF_DEF:0 "Югославская конфедерация"
 YUG_CONF_ADJ:0 "югославский"
 YUG_UNION:0 "Союз югославских республик"
 YUG_UNION_DEF:0 "Союз югославских республик"
 YUG_UNION_ADJ:0 "югославский"
 MAC_NORTH:0 "Северная Македония"
 MAC_NORTH_DEF:0 "Республика Северная Македония"
 MAC_NORTH_ADJ:0 "македонский"
 Y89_YUG_presidency:0 "Президент СФРЮ"
 Y89_YUG_milosevic:0 "Слободан Милошевич"
 Y89_YUG_council_republics:0 "Совет республик"
 Y89_YUG_dos:0 "Демократическая оппозиция"
 Y89_SER_government:0 "Правительство Сербии"
 Y89_CRO_tudjman:0 "Франьо Туджман"
 Y89_SLV_government:0 "Правительство Словении"
 Y89_BOS_izetbegovic:0 "Алия Изетбегович"
 Y89_MNT_government:0 "Правительство Черногории"
 Y89_MAC_government:0 "Правительство Македонии"
 Y89_KOS_government:0 "Правительство Косово"
 Y89_foreign_debt:0 "Внешний долг"
 Y89_foreign_debt_desc:0 "Международные кредиторы требуют стабилизационных мер, а население ощущает рост цен."
 Y89_hyperinflation:0 "Гиперинфляция"
 Y89_hyperinflation_desc:0 "Инфляция, безработица и падение реальных доходов подрывают доверие к федерации."
 Y89_collective_presidency:0 "Коллективное президентство"
 Y89_collective_presidency_desc:0 "После смерти Тито ротация руководства не дала никому прежнего авторитета арбитра."
 Y89_stabilization_program:0 "Стабилизационная программа"
 Y89_stabilization_program_desc:0 "Жёсткие меры против инфляции восстанавливают экономику, но бьют по доходам."
 Y89_federal_deadlock:0 "Федеральный тупик"
 Y89_federal_deadlock_desc:0 "Республиканские руководства больше не находят общей программы."
 Y89_arms_embargo:0 "Оружейное эмбарго"
 Y89_arms_embargo_desc:0 "Резолюция СБ ООН 713 от 25 сентября 1991 года."
 Y89_un_sanctions:0 "Санкции ООН"
 Y89_un_sanctions_desc:0 "Резолюция СБ ООН 757 от 30 мая 1992 года ужесточила санкции против СРЮ."
 Y89_unmik:0 "Международная администрация в Косово"
 Y89_unmik_desc:0 "Резолюция СБ ООН 1244 создала основу международного присутствия в крае."
 Y89_confederal_institutions:0 "Конфедеральные институты"
 Y89_confederal_institutions_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Республики, конфедерация и местное самоуправление делят власть по договору."
 Y89_civilian_control_army:0 "Гражданский контроль над армией"
 Y89_civilian_control_army_desc:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ. Армия не может участвовать во внутренней политической борьбе."
