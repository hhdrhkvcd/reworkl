 LOADING_TIP_0:0 "Reworkl объединяет Югославию, Сербию и радио с турбо-фолком в одном моде."
 LOADING_TIP_1:0 "Выбирай Югославию в 1989 году или Сербию в 1936-м. Это две отдельные кампании."
 LOADING_TIP_2:0 "Включай в наборе только Reworkl. Три исходных мода уже объединены внутри сборки."
 LOADING_TIP_3:0 "У Сербии 1936 года собственная армия и дерево из 131 фокуса."
 LOADING_TIP_4:0 "Федерация начинает кампанию 1989 года с 19 областями и 15 дивизиями ЮНА."
 LOADING_TIP_5:0 "Заверши Комиссию по гарантиям до распада, чтобы отключить автоматический календарь отделения республик."
 LOADING_TIP_6:0 "Выбери «Турбо-фолк — Reworkl» в музыкальном плеере: на станции 23 композиции."
 LOADING_TIP_7:0 "После обновления начни новую кампанию. Старые сохранения могут быть несовместимы."
 LOADING_TIP_8:0 "Загрузочные иллюстрации: Белград, Динарские горы и штаб в 1989 году."
 LOADING_TIP_9:0 "Если загрузка прервалась, запусти HOI4 с параметром -debug и проверь logs/error.log."
