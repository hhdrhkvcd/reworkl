l_english:
 LOADING_TIP_0:0 "Reworkl combines Yugoslavia, Serbia and the turbo-folk radio in one mod."
 LOADING_TIP_1:0 "Choose Yugoslavia in 1989 or Serbia in 1936. These are two separate campaigns."
 LOADING_TIP_2:0 "Enable only Reworkl in your playset. The three original mods are already combined."
 LOADING_TIP_3:0 "The Serbian 1936 campaign has its own army and a tree of 131 focuses."
 LOADING_TIP_4:0 "The federation begins the 1989 campaign with 19 states and 15 JNA divisions."
 LOADING_TIP_5:0 "Complete the Guarantees Commission before the breakup to stop the automatic dissolution calendar."
 LOADING_TIP_6:0 "Select Turbo-folk — Reworkl in the radio player to hear the 23 included tracks."
 LOADING_TIP_7:0 "After installing an update, start a new campaign. Old saves may be incompatible."
 LOADING_TIP_8:0 "Loading artwork: Belgrade, the Dinaric mountains and a staff room in 1989."
 LOADING_TIP_9:0 "If loading fails, launch HOI4 with -debug and inspect logs/error.log."
