l_english:
 REWORKL_BOOKMARK_SERBIA:0 "Serbia — standalone campaign, 1936"
 REWORKL_BOOKMARK_SERBIA_DESC:0 "The independent Serbian campaign with the original custom focus tree. The Balkan republics are separate countries. The Yugoslav 1989 calendar is disabled; the Turbo-folk radio is available in both campaigns."
 REWORKL_BOOKMARK_SERBIA_HISTORY:0 "Lead Serbia through its political, economic and military focus branches. This scenario is separate from the 1989 Yugoslav federation."
 REWORKL_BOOKMARK_SERBIA_OTHER:0 "Choose another country on the map. The Turbo-folk station remains available."
 Y89_GER_TEST_economic_recovery:0 "Economic recovery"
 Y89_GER_TEST_infrastructure:0 "Civilian infrastructure"
 Y89_GER_TEST_science:0 "Scientific cooperation"
 Y89_ITA_TEST_economic_recovery:0 "Economic recovery"
 Y89_ITA_TEST_infrastructure:0 "Civilian infrastructure"
 Y89_ITA_TEST_science:0 "Scientific cooperation"
 Y89_TEST_NON_INTERVENTION:0 "Non-intervention"
 Y89_TEST_NON_INTERVENTION_desc:0 "This country follows the peaceful test focus tree and cannot declare wars in the 1989 scenario."
 Y89_JNA_commander_name:0 "JNA General Staff"
 Y89_breakup.1.t:0 "Slovenia and Croatia declare independence"
 Y89_breakup.1.d:0 "On 25 June 1991, Slovenia and Croatia declare their independence. The federal institutions lose control of the two republics."
 Y89_breakup.1.a:0 "The federation is breaking apart."
 Y89_breakup.2.t:0 "Macedonian independence"
 Y89_breakup.2.d:0 "Following the referendum of September 1991, Macedonia leaves the federation."
 Y89_breakup.2.a:0 "A new republic emerges."
 Y89_breakup.3.t:0 "Independence of Bosnia and Herzegovina"
 Y89_breakup.3.d:0 "In the spring of 1992, Bosnia and Herzegovina declares independence following its referendum. The former federal state has effectively ceased to exist."
 Y89_breakup.3.a:0 "The federation has lost another republic."
 Y89_breakup.4.t:0 "Montenegrin independence"
 Y89_breakup.4.d:0 "In June 2006, Montenegro declares independence after a referendum. The state union of Serbia and Montenegro ends."
 Y89_breakup.4.a:0 "The union has ended."
 Y89_breakup.5.t:0 "Kosovo declaration of independence"
 Y89_breakup.5.d:0 "On 17 February 2008, the Assembly of Kosovo declares independence. Serbia does not recognise the declaration."
 Y89_breakup.5.a:0 "A disputed declaration."
 Y89_sanctions.1.t:0 "UN arms embargo"
 Y89_sanctions.1.d:0 "On 25 September 1991, UN Security Council Resolution 713 imposes an arms embargo on the former Yugoslav federation."
 Y89_sanctions.1.a:0 "Our arms supply has been restricted."
 Y89_sanctions.2.t:0 "UN comprehensive sanctions"
 Y89_sanctions.2.d:0 "On 30 May 1992, UN Security Council Resolution 757 imposes comprehensive sanctions on the Federal Republic of Yugoslavia."
 Y89_sanctions.2.a:0 "The economy faces international isolation."
